    <hr/>

    ## Info H2 inside an H1
    RapiDoc doesn't render.

    Redoc v3 tucks this inside the collapsible H1, indented deeper than the H2 and H3 that are above the H1.
    <hr/>

    ### Info H3 in the H2 in the H1
    Redoc v3 places this at the same indentation as the preceding H2, deeper than the H2 and H3 that are above the H1.

tags:
- name: Tag with headings
  description: |

    ## h2
    body 2 outside an H1.
    ## h2.2
    body 2.2 outside an H1.
    ## h22.  Clashes with the one above.
    body 22.  The href for this section clashes with h2.2

    ### h3.  Level-three heading in the "Tag with headings" tag.
    H3 text.

    # h1.
    body 1
    ## h2
    body 2
    ## h2.2
    body 2.2
    ## h22.  Clashes with the one above.
    body 22.  The href for this section clashes with h2.2

    ### h3.  Level-three heading in the "Tag with headings" tag.

paths:
  /api:
    get:
      tags: ["Tag with headings"]
      description: This operation is here because RapiDoc doesn't show tags that don't have operations, and I need RapiDoc to show the tag's headings in its navbar.
      summary: ignore_me
      responses:
        "200":
          description: desc
          content:
            application/json:
              schema: { type: object, properties: {ape: {type: string}}}
